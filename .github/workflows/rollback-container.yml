name: Rollback Container

# Rollback Drill 2: redeploy a previous, known-good image by its commit SHA.
# Every release pins its own image tag, so this is an ordinary CDK deployment of an older
# image: the task definition, CloudFormation and the running service all agree afterwards.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Known-good image tag (full commit SHA) already in ECR'
        required: true

concurrency:
  group: container-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: astro-blog

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Image Tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full 40-character commit SHA" && exit 1
          fi

      - uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      # The CDK app also defines StaticSiteStack, which needs dist/client to synthesize.
      - name: Build Astro Site
        run: npm ci && npm run build

      - name: Install CDK Dependencies
        run: npm ci --prefix cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the Image Exists in ECR
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" > /dev/null \
            || { echo "Image tag $IMAGE_TAG not found in $ECR_REPOSITORY" && exit 1; }

      - name: Deploy the Known-Good Image
        working-directory: cdk
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          USE_CLOUDFRONT: ${{ vars.USE_CLOUDFRONT || 'false' }}
        run: |
          npx cdk deploy ContainerServiceStack --require-approval never \
            -c cloudfront="$USE_CLOUDFRONT" -c imageTag="$IMAGE_TAG" --outputs-file outputs.json

      - name: Wait for the Rolling Update and Smoke Test
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          CLUSTER=$(jq -r '.ContainerServiceStack.ClusterName' cdk/outputs.json)
          SERVICE=$(jq -r '.ContainerServiceStack.ServiceName' cdk/outputs.json)
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          URL=$(jq -r '.ContainerServiceStack.ServiceUrl' cdk/outputs.json)
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "$URL/api/health"
          echo "Rolled back to $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
