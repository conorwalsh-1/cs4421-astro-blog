name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type & schema check
        run: npm run check

      - name: Run unit & integration tests with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix cdk

      - name: Build site (CDK bundles dist/client)
        run: npm run build

      - name: Test CDK stacks
        working-directory: cdk
        run: npm test -- --runInBand

      - name: Synthesize all CDK stacks
        working-directory: cdk
        run: npx cdk synth --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t astro-blog:ci .

      - name: Run container and wait for HEALTHCHECK to report healthy
        run: |
          docker run -d -p 4321:4321 -e NODE_ENV=production --name my-blog astro-blog:ci
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' my-blog)
            if [ "$STATUS" = "healthy" ]; then
              curl -fsS http://localhost:4321/api/health
              exit 0
            fi
            sleep 2
          done
          docker inspect --format='{{json .State.Health}}' my-blog
          docker logs my-blog
          exit 1
