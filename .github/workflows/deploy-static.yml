name: Deploy Static Site via AWS CDK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-site-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install Project & CDK Dependencies
        run: |
          npm ci
          npm ci --prefix cdk

      - name: Build Astro Static Site
        run: npm run build

      - name: Test CDK Stack
        working-directory: cdk
        run: npm test -- --runInBand

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Infrastructure & Assets with AWS CDK
        working-directory: cdk
        run: npx cdk deploy StaticSiteStack --require-approval never
